name: Treecraft CMS CI

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main ]

jobs:
  validate-and-test:
    name: Lint, Static Checks & Automated Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --port 27017 --eval \"db.adminCommand('ping')\""
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check Branding & Conventions
        run: npm run check:branding

      - name: Check Language Definitions
        run: npm run check:languages

      - name: Check Environment Integrity
        run: npm run check:env

      - name: Run System Doctor
        run: npm run doctor
        env:
          APP_ENV: development
          PORT: 4000
          MONGO_URI: mongodb://127.0.0.1:27017/treecraft_test
          SESSION_SECRET: test_session_secret_for_ci_pipeline_2026

      - name: Run Automated Test Suites (Jest)
        run: npm test
        env:
          NODE_ENV: test
          APP_ENV: development
          MONGO_URI: mongodb://127.0.0.1:27017/treecraft_test
          SESSION_SECRET: test_session_secret_for_ci_pipeline_2026

      - name: Build Production Docker Image (Dry Run)
        run: docker build -t treecraft-cms:ci .
